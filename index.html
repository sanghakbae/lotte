<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행운 로또 · Lucky Lotto</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
  /* KoPub World 돋움체 */
  @font-face {
    font-family: 'KoPubWorldDotum';
    font-weight: 300;
    src: url('https://cdn.jsdelivr.net/gh/adrinerDP/font-kopubworld@master/fonts/KoPubWorld-Dotum-Light.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/adrinerDP/font-kopubworld@master/fonts/KoPubWorld-Dotum-Light.woff') format('woff');
    font-display: swap;
  }
  @font-face {
    font-family: 'KoPubWorldDotum';
    font-weight: 500;
    src: url('https://cdn.jsdelivr.net/gh/adrinerDP/font-kopubworld@master/fonts/KoPubWorld-Dotum-Medium.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/adrinerDP/font-kopubworld@master/fonts/KoPubWorld-Dotum-Medium.woff') format('woff');
    font-display: swap;
  }
  @font-face {
    font-family: 'KoPubWorldDotum';
    font-weight: 700;
    src: url('https://cdn.jsdelivr.net/gh/adrinerDP/font-kopubworld@master/fonts/KoPubWorld-Dotum-Bold.woff2') format('woff2'),
         url('https://cdn.jsdelivr.net/gh/adrinerDP/font-kopubworld@master/fonts/KoPubWorld-Dotum-Bold.woff') format('woff');
    font-display: swap;
  }
  :root {
    --gold: #f6c945;
    --gold-deep: #e9b22e;
    --ink: #f5f2e8;           /* 밝은 본문 텍스트 */
    --muted: #9b96b4;
    --panel: rgba(255,255,255,0.055);
    --panel-2: rgba(255,255,255,0.09);
    --line: rgba(255,255,255,0.12);
    --shadow: 0 24px 60px rgba(0,0,0,0.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; }
  body {
    font-family: "KoPubWorldDotum", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: clamp(12px, 3vw, 32px);
    overflow-x: hidden;
    /* 깊은 인디고 — 컬러 공이 또렷하게 보이도록 */
    background: radial-gradient(1200px 600px at 15% -10%, #25305c 0%, transparent 55%),
                radial-gradient(900px 500px at 100% 110%, #3a2350 0%, transparent 50%),
                linear-gradient(160deg, #11142b 0%, #0c0e20 100%);
    background-attachment: fixed;
  }
  .orb { position: fixed; border-radius: 50%; filter: blur(10px); opacity: 0.28; pointer-events: none; z-index: 0; }
  .orb.o1 { width: 280px; height: 280px; background: radial-gradient(circle at 30% 30%, #ffe48a, #d99e2b00); top: -90px; left: -80px; animation: float 13s ease-in-out infinite; }
  .orb.o2 { width: 220px; height: 220px; background: radial-gradient(circle at 30% 30%, #8ab4ff, #2a48a000); bottom: -70px; right: -60px; animation: float 16s ease-in-out infinite reverse; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-22px) } }

  .wrap {
    position: relative; z-index: 1;
    display: flex; gap: clamp(12px, 1.6vw, 20px); align-items: stretch;
    width: 100%; max-width: 1200px; margin: 0 auto;
  }

  .card, .sidebar {
    background: var(--panel);
    backdrop-filter: blur(18px) saturate(130%);
    -webkit-backdrop-filter: blur(18px) saturate(130%);
    border: 1px solid var(--line);
    border-radius: 24px;
    box-shadow: var(--shadow);
  }
  /* 33 : 33 : 33 — 가로폭 100% 3등분 */
  .card { flex: 1 1 0; padding: clamp(22px, 3vw, 34px) clamp(18px, 2.6vw, 30px) 26px; text-align: center; min-width: 0; }
  .sidebar { flex: 1 1 0; padding: 18px 14px; display: flex; flex-direction: column; min-width: 0; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px;
    background: rgba(246,201,69,0.14); color: var(--gold);
    padding: 6px 14px; border-radius: 999px; margin-bottom: 14px;
    border: 1px solid rgba(246,201,69,0.3);
  }
  h1 { font-family: "KoPubWorldDotum", sans-serif; font-weight: 700; font-size: clamp(30px, 6vw, 40px); line-height: 1.1; color: #fff; }
  h1 .em { color: var(--gold); }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 8px; margin-bottom: 8px; font-weight: 500; }
  .updated { font-size: 11px; color: var(--gold-deep); font-weight: 600; margin-bottom: 20px; }

  .modes { display: flex; background: rgba(0,0,0,0.25); border-radius: 14px; padding: 5px; gap: 5px; margin-bottom: 18px; border: 1px solid var(--line); }
  .mode-btn {
    flex: 1; border: none; cursor: pointer; padding: 11px 8px; border-radius: 10px;
    font-family: inherit; font-weight: 700; font-size: 13px; color: var(--muted); background: transparent; transition: all .25s;
  }
  .mode-btn.active { background: linear-gradient(135deg, var(--gold), var(--gold-deep)); color: #2a2106; box-shadow: 0 4px 14px rgba(233,178,46,0.35); }

  .top10-info { display: none; background: rgba(255,120,120,0.1); border: 1px solid rgba(255,120,120,0.28); border-radius: 14px; padding: 13px 12px 11px; margin-bottom: 18px; }
  .top10-info.show { display: block; animation: rise .35s; }
  .t10-title { font-size: 11.5px; font-weight: 700; color: #ff9d9d; margin-bottom: 10px; }
  .t10-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .t10-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .t10-cell .cnt { font-size: 10.5px; font-weight: 700; color: var(--muted); }
  .t10-cell .cnt b { color: #fff; }

  .controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .controls label { color: var(--muted); font-size: 13px; font-weight: 600; }
  .stepper { display: flex; align-items: center; background: rgba(0,0,0,0.3); border-radius: 12px; overflow: hidden; border: 1px solid var(--line); }
  .stepper button { width: 38px; height: 40px; border: none; background: transparent; font-size: 20px; font-weight: 700; color: var(--gold); cursor: pointer; }
  .stepper button:hover { background: rgba(255,255,255,0.08); }
  .stepper input { width: 42px; height: 40px; border: none; background: transparent; text-align: center; font-size: 17px; font-weight: 700; color: #fff; font-family: inherit; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .btn { width: 100%; border: none; cursor: pointer; font-family: inherit; font-weight: 700; border-radius: 16px; transition: transform .12s, box-shadow .25s, filter .2s; }
  .btn-primary {
    padding: 16px; font-size: 16.5px; color: #2a2106; letter-spacing: .5px;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    box-shadow: 0 8px 22px rgba(233,178,46,0.4);
  }
  .btn-primary:hover { filter: brightness(1.05); box-shadow: 0 12px 28px rgba(233,178,46,0.5); }
  .btn-primary:active { transform: scale(0.97); }

  .results { margin-top: 24px; display: flex; flex-direction: column; gap: 13px; }
  .line { display: flex; gap: clamp(5px, 1.2vw, 9px); justify-content: center; align-items: center; flex-wrap: nowrap; opacity: 0; transform: translateY(10px); animation: rise .5s forwards; }
  .line .idx { font-size: 12px; font-weight: 700; color: var(--gold); flex: 0 0 14px; text-align: right; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .ball {
    flex: 0 0 auto;
    width: clamp(34px, 2.6vw, 48px); height: clamp(34px, 2.6vw, 48px); border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: clamp(15px, 1.1vw, 18px); position: relative;
    text-shadow: 0 1px 2px rgba(0,0,0,0.28);
    box-shadow: inset -3px -4px 7px rgba(0,0,0,0.3), inset 2px 3px 5px rgba(255,255,255,0.5), 0 5px 12px rgba(0,0,0,0.4);
    animation: pop .4s backwards;
  }
  .ball::after { content: ""; position: absolute; top: 7px; left: 10px; width: 13px; height: 8px; background: rgba(255,255,255,0.65); border-radius: 50%; filter: blur(1px); }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  /* 진한 색상 + 또렷한 글자 (번호 가독성 ↑) */
  .c1 { background: radial-gradient(circle at 35% 28%, #ffd633, #f0a500); color:#3d2c00; }   /* 1-10 노랑 */
  .c2 { background: radial-gradient(circle at 35% 28%, #4db5f0, #1f7fc4); color:#fff; }       /* 11-20 파랑 */
  .c3 { background: radial-gradient(circle at 35% 28%, #ff6b6b, #e23434); color:#fff; }       /* 21-30 빨강 */
  .c4 { background: radial-gradient(circle at 35% 28%, #9aa0a8, #5c636d); color:#fff; }       /* 31-40 회색 */
  .c5 { background: radial-gradient(circle at 35% 28%, #9fd13a, #6fa015); color:#1c2900; }    /* 41-45 초록 */

  .actions { margin-top: 20px; display: none; }
  .btn-primary.save { background: linear-gradient(135deg, #5fd089, #34a868); color: #04210f; box-shadow: 0 8px 22px rgba(52,168,104,0.4); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 12.5px; min-height: 16px; font-weight: 600; color: var(--muted); transition: color .2s; }
  .status.ok { color: #5fd089; }
  .status.err { color: #ff7a7a; }

  .sidebar h2 { font-size: 15px; color: #fff; display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .sidebar .sub { font-size: 11px; color: var(--muted); margin-bottom: 10px; }
  .refresh { border: none; background: transparent; cursor: pointer; font-size: 16px; color: var(--gold); padding: 2px 6px; border-radius: 8px; }
  .refresh:hover { background: rgba(255,255,255,0.08); }
  .hist-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 7px; max-height: clamp(300px, 56vh, 470px); padding-right: 3px; }
  .win-list { display: flex; flex-direction: column; gap: 6px; }  /* 10개 전부 표시, 스크롤 없음 */
  .hist-empty { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 30px; line-height: 1.6; }
  .hitem, .witem { background: var(--panel-2); border: 1px solid var(--line); border-radius: 11px; padding: 7px 9px; animation: rise .4s backwards; }
  .hitem .top, .witem .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .hitem .time { color: var(--muted); font-size: 10.5px; font-weight: 600; }
  .hitem .tag { font-size: 9.5px; background: rgba(246,201,69,0.18); color: var(--gold); padding: 2px 7px; border-radius: 6px; font-weight: 700; }
  .hitem .tag.pop { background: rgba(255,120,120,0.2); color: #ff9d9d; }
  .hgame { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 5px; }
  .hgame:last-child { margin-bottom: 0; }
  .mini { width: 25px; height: 25px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; text-shadow: 0 1px 1px rgba(0,0,0,0.25); box-shadow: inset -1px -2px 3px rgba(0,0,0,0.25); }
  .plus { display: flex; align-items: center; color: var(--muted); font-weight: 700; font-size: 13px; }

  .witem .top { align-items: baseline; }
  .witem .no { font-size: 12px; font-weight: 800; color: var(--gold); }
  .witem .date { font-size: 10px; color: var(--muted); font-weight: 600; }
  /* 6개 + 보너스볼을 한 줄에 — 열 너비에 맞춰 유동 축소(잘림/줄바꿈/스크롤 없음) */
  .wrow { display: flex; gap: 3px; flex-wrap: nowrap; align-items: center; width: 100%; }
  .wrow .mini { flex: 1 1 0; min-width: 0; width: auto; height: auto; aspect-ratio: 1 / 1; font-size: clamp(9px, 2.4vw, 11px); }
  .wrow .plus { flex: 0 0 auto; font-size: 11px; }

  .footer { margin-top: 20px; color: var(--muted); font-size: 11.5px; font-weight: 500; }
  .footer .disc { display:block; margin-top:5px; font-size:10.5px; color:#7e789a; }

  /* 좁은 화면: 세로 적층, 폭 100% (3등분 시 가운데 공이 빠듯해지므로 여유 있게 1200px에서 전환) */
  @media (max-width: 1200px) {
    body { align-items: stretch; }
    .wrap { flex-direction: column; max-width: 620px; margin: 0 auto; }
    .card { order: -1; }
    .sidebar { flex: 1 1 auto; }
    .hist-list { max-height: 320px; }
    /* 적층 시에는 폭이 넉넉하므로 공을 크게 */
    .ball { width: clamp(42px, 12vw, 52px); height: clamp(42px, 12vw, 52px); font-size: clamp(16px, 4.4vw, 19px); }
  }
</style>
</head>
<body>
  <div class="orb o1"></div>
  <div class="orb o2"></div>

  <div class="wrap">
    <!-- 왼쪽: 최근 1등 당첨번호 -->
    <div class="sidebar">
      <h2>🏆 최근 당첨번호</h2>
      <p class="sub">1등 당첨번호 · 최근 10회</p>
      <div class="win-list" id="winList"></div>
    </div>

    <!-- 생성기 -->
    <div class="card">
      <span class="badge">✦ LUCKY DRAW ✦</span>
      <h1>행운 <span class="em">로또</span></h1>
      <p class="subtitle">1~45 중 6개 · 당신의 행운을 뽑아보세요</p>
      <p class="updated" id="updatedLine"></p>

      <div class="modes">
        <button class="mode-btn active" data-mode="random">🎲 완전 랜덤</button>
        <button class="mode-btn" data-mode="popular">🔥 인기 TOP10 조합</button>
      </div>

      <div class="top10-info" id="top10Info">
        <p class="t10-title">최근 20년간 1등에 포함된 횟수</p>
        <div class="t10-grid" id="t10grid"></div>
      </div>

      <div class="controls">
        <label>게임 수</label>
        <div class="stepper">
          <button id="minus" type="button">−</button>
          <input type="number" id="count" min="1" max="10" value="5" readonly>
          <button id="plus" type="button">+</button>
        </div>
        <label>줄</label>
      </div>

      <button id="generateBtn" class="btn btn-primary">번호 생성하기 ✨</button>

      <div class="results" id="results"></div>

      <div class="actions" id="actions">
        <button id="saveBtn" class="btn btn-primary save">☁️ 이 번호 저장하기</button>
      </div>
      <p class="status" id="status"></p>
    </div>

    <!-- 오른쪽: 저장 기록 -->
    <div class="sidebar">
      <h2>📜 저장 기록 <button class="refresh" id="refreshBtn" title="새로고침">⟳</button></h2>
      <p class="sub">DB에 저장된 번호 · 최근 20건</p>
      <div class="hist-list" id="history">
        <p class="hist-empty">아직 저장된 번호가 없어요.<br>번호를 생성하고 저장해 보세요!</p>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase 프로젝트 설정 (lotte-d9e9a)
const firebaseConfig = {
  apiKey: "AIzaSyD-oZl39BXtKagdsctoGEwj7tcz0BuaIgM",
  authDomain: "lotte-d9e9a.firebaseapp.com",
  projectId: "lotte-d9e9a",
  storageBucket: "lotte-d9e9a.firebasestorage.app",
  messagingSenderId: "292774497378",
  appId: "1:292774497378:web:94f9c1fa4831905a9f553b",
  measurementId: "G-KEDN7KBET0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COLLECTION = "lotto_games";

// 통계 마지막 갱신일 (매주 월요일 자동 업데이트)
const LAST_UPDATED = "2026-07-13";

// 최근 20년 최다 출현 TOP10 (189~1232회 집계, 갱신: 2026-07-13)
const TOP10 = [
  { n: 12, count: 160 },
  { n: 13, count: 155 },
  { n: 27, count: 155 },
  { n: 34, count: 153 },
  { n: 38, count: 152 },
  { n: 45, count: 152 },
  { n: 14, count: 151 },
  { n: 18, count: 147 },
  { n: 20, count: 147 },
  { n: 24, count: 146 },
];
const TOP10_NUMS = TOP10.map(t => t.n);

// 최근 1등 당첨번호 10회 (매주 월요일 자동 갱신)
const RECENT_WINS = [
  { no: 1232, date: "2026-07-11", nums: [12,15,19,22,24,36], bonus: 3 },
  { no: 1231, date: "2026-07-04", nums: [4,13,14,18,31,38], bonus: 15 },
  { no: 1230, date: "2026-06-27", nums: [3,8,9,22,28,42], bonus: 45 },
  { no: 1229, date: "2026-06-20", nums: [12,13,29,34,37,42], bonus: 16 },
  { no: 1228, date: "2026-06-13", nums: [24,29,30,31,35,44], bonus: 1 },
  { no: 1227, date: "2026-06-06", nums: [1,14,16,34,41,44], bonus: 13 },
  { no: 1226, date: "2026-05-30", nums: [4,6,13,17,26,28], bonus: 41 },
  { no: 1225, date: "2026-05-23", nums: [8,9,19,25,41,42], bonus: 33 },
  { no: 1224, date: "2026-05-16", nums: [9,18,21,27,44,45], bonus: 28 },
  { no: 1223, date: "2026-05-09", nums: [16,18,20,32,33,39], bonus: 26 },
];

let lastGames = [];
let mode = 'random';

function pickRandom() {
  const set = new Set();
  while (set.size < 6) set.add(Math.floor(Math.random() * 45) + 1);
  return [...set].sort((a, b) => a - b);
}
function pickPopular() {
  const pool = [...TOP10_NUMS];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 6).sort((a, b) => a - b);
}
function colorClass(n) {
  if (n <= 10) return 'c1';
  if (n <= 20) return 'c2';
  if (n <= 30) return 'c3';
  if (n <= 40) return 'c4';
  return 'c5';
}
function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

// 추천 TOP10 + 1등 포함 횟수 렌더링
function renderTop10Info() {
  const grid = document.getElementById('t10grid');
  grid.innerHTML = '';
  TOP10.forEach(t => {
    const cell = document.createElement('div');
    cell.className = 't10-cell';
    cell.innerHTML = `<span class="ball ${colorClass(t.n)}" style="width:38px;height:38px;font-size:15px;animation:none">${t.n}</span>` +
      `<span class="cnt"><b>${t.count}</b>회</span>`;
    grid.appendChild(cell);
  });
}
function updateModeInfo() {
  document.getElementById('top10Info').classList.toggle('show', mode === 'popular');
}

// 왼쪽 최근 당첨번호 렌더링
function renderRecentWins() {
  const el = document.getElementById('winList');
  el.innerHTML = '';
  RECENT_WINS.forEach((w, i) => {
    const item = document.createElement('div');
    item.className = 'witem';
    item.style.animationDelay = (i * 0.04) + 's';
    const balls = w.nums.map(n => `<span class="mini ${colorClass(n)}">${n}</span>`).join('');
    item.innerHTML =
      `<div class="top"><span class="no">${w.no}회</span><span class="date">${w.date}</span></div>` +
      `<div class="wrow">${balls}<span class="plus">+</span><span class="mini ${colorClass(w.bonus)}">${w.bonus}</span></div>`;
    el.appendChild(item);
  });
}

function generate() {
  const count = parseInt(document.getElementById('count').value, 10) || 5;
  const results = document.getElementById('results');
  results.innerHTML = '';
  lastGames = [];

  for (let i = 0; i < count; i++) {
    const nums = mode === 'popular' ? pickPopular() : pickRandom();
    lastGames.push(nums);

    const line = document.createElement('div');
    line.className = 'line';
    line.style.animationDelay = (i * 0.09) + 's';

    const idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = String.fromCharCode(65 + i);
    line.appendChild(idx);

    nums.forEach((n, k) => {
      const ball = document.createElement('div');
      ball.className = 'ball ' + colorClass(n);
      ball.style.animationDelay = (i * 0.09 + k * 0.05) + 's';
      ball.textContent = n;
      line.appendChild(ball);
    });
    results.appendChild(line);
  }
  document.getElementById('actions').style.display = 'block';
  setStatus('');
}

async function saveToFirebase() {
  if (!lastGames.length) { setStatus('먼저 번호를 생성하세요.', 'err'); return; }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; setStatus('저장 중…');
  try {
    await addDoc(collection(db, COLLECTION), {
      games: lastGames.map(nums => ({ nums })), // Firestore는 중첩 배열 불가 → 맵으로 감쌈
      count: lastGames.length,
      mode,
      source: 'web',
      createdAt: serverTimestamp()
    });
    setStatus('✅ 저장 완료! 오른쪽 기록에 추가됐어요.', 'ok');
    loadHistory(); // 저장 직후 오른쪽 패널 자동 갱신
  } catch (e) {
    console.error(e); setStatus('저장 실패: ' + e.message, 'err');
  } finally { btn.disabled = false; }
}

async function loadHistory() {
  const historyEl = document.getElementById('history');
  try {
    const q = query(collection(db, COLLECTION), orderBy('createdAt', 'desc'), limit(20));
    const snap = await getDocs(q);
    if (snap.empty) {
      historyEl.innerHTML = '<p class="hist-empty">아직 저장된 번호가 없어요.<br>번호를 생성하고 저장해 보세요!</p>';
      return;
    }
    historyEl.innerHTML = '';
    let i = 0;
    snap.forEach(doc => {
      const d = doc.data();
      const item = document.createElement('div');
      item.className = 'hitem';
      item.style.animationDelay = (i++ * 0.04) + 's';

      const t = d.createdAt?.toDate ? d.createdAt.toDate().toLocaleString('ko-KR', {
        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
      }) : '시간 정보 없음';
      const tag = d.mode === 'popular'
        ? '<span class="tag pop">인기조합</span>'
        : (d.source && d.source.includes('top10')) ? '<span class="tag pop">추천</span>'
        : '<span class="tag">랜덤</span>';

      const gamesHtml = (d.games || []).map(g => {
        const balls = (g.nums || []).map(n =>
          `<span class="mini ${colorClass(n)}">${n}</span>`).join('');
        return `<div class="hgame">${balls}</div>`;
      }).join('');

      item.innerHTML = `<div class="top"><span class="time">🕒 ${t}</span>${tag}</div>${gamesHtml}`;
      historyEl.appendChild(item);
    });
  } catch (e) {
    console.error(e);
    historyEl.innerHTML = `<p class="hist-empty">기록을 불러오지 못했어요.<br>${e.message}</p>`;
  }
}

// 모드 토글
document.querySelectorAll('.mode-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
    updateModeInfo();
    generate();
  });
});
// 스텝퍼
const countEl = document.getElementById('count');
document.getElementById('plus').addEventListener('click', () => { countEl.value = Math.min(10, (+countEl.value) + 1); });
document.getElementById('minus').addEventListener('click', () => { countEl.value = Math.max(1, (+countEl.value) - 1); });
document.getElementById('generateBtn').addEventListener('click', generate);
document.getElementById('saveBtn').addEventListener('click', saveToFirebase);
document.getElementById('refreshBtn').addEventListener('click', loadHistory);

document.getElementById('updatedLine').textContent = `📅 통계 업데이트: ${LAST_UPDATED} (매주 월요일 자동)`;
renderTop10Info();   // 추천 번호 + 1등 포함 횟수
updateModeInfo();
renderRecentWins();  // 왼쪽 최근 당첨번호
generate();
loadHistory();       // 페이지 로드 시 저장 기록 자동 표시
</script>
</body>
</html>
