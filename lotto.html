<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>행운 로또 · Lucky Lotto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #e0a82e;        /* 차분한 골드 액센트 */
    --gold-deep: #c98a18;
    --ink: #3a3320;
    --muted: #8a7d5f;
    --cream: #faf6ec;
    --glass: rgba(255,255,255,0.72);
    --glass-line: rgba(255,255,255,0.9);
    --shadow: 0 20px 50px rgba(120,95,30,0.16);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Noto Sans KR", -apple-system, BlinkMacSystemFont, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    overflow-x: hidden;
    /* 부드러운 크림 톤 — 노랑 최소화 */
    background: linear-gradient(125deg, #fdfcf7 0%, #f7f1e2 45%, #f1e7cf 100%);
    background-attachment: fixed;
  }
  /* 아주 옅은 장식 원 */
  .orb { position: fixed; border-radius: 50%; filter: blur(8px); opacity: 0.22; pointer-events: none; z-index: 0; }
  .orb.o1 { width: 260px; height: 260px; background: radial-gradient(circle at 30% 30%, #fff, #f3d98a); top: -80px; left: -70px; animation: float 12s ease-in-out infinite; }
  .orb.o2 { width: 200px; height: 200px; background: radial-gradient(circle at 30% 30%, #fff, #e7cf9a); bottom: -60px; right: -50px; animation: float 15s ease-in-out infinite reverse; }
  @keyframes float { 0%,100% { transform: translateY(0) } 50% { transform: translateY(-22px) } }

  .wrap {
    position: relative; z-index: 1;
    display: flex; gap: 20px; align-items: stretch;
    width: 100%; max-width: 1180px;
  }

  .card, .sidebar {
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(140%);
    -webkit-backdrop-filter: blur(20px) saturate(140%);
    border: 1px solid var(--glass-line);
    border-radius: 26px;
    box-shadow: var(--shadow);
  }
  .card { flex: 1 1 440px; padding: 34px 30px 28px; text-align: center; min-width: 0; }
  .sidebar { flex: 0 0 280px; padding: 24px 20px; display: flex; flex-direction: column; min-width: 0; }

  .badge {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 700; letter-spacing: 1.5px;
    background: rgba(224,168,46,0.12); color: var(--gold-deep);
    padding: 6px 14px; border-radius: 999px; margin-bottom: 14px;
    border: 1px solid rgba(224,168,46,0.25);
  }
  h1 { font-family: "Black Han Sans", sans-serif; font-size: 38px; line-height: 1.1; color: var(--ink); }
  h1 .em { color: var(--gold-deep); }
  .subtitle { color: var(--muted); font-size: 13px; margin-top: 8px; margin-bottom: 22px; font-weight: 500; }

  .modes { display: flex; background: rgba(0,0,0,0.04); border-radius: 14px; padding: 5px; gap: 5px; margin-bottom: 18px; }
  .mode-btn {
    flex: 1; border: none; cursor: pointer; padding: 11px 8px; border-radius: 10px;
    font-family: inherit; font-weight: 700; font-size: 13px; color: var(--muted); background: transparent; transition: all .25s;
  }
  .mode-btn.active { background: #fff; color: var(--gold-deep); box-shadow: 0 3px 10px rgba(120,95,30,0.12); }

  /* 인기 TOP10 횟수 정보 (인기 모드에서만 표시) */
  .top10-info { display: none; background: rgba(255,114,114,0.06); border: 1px solid rgba(255,114,114,0.18); border-radius: 14px; padding: 13px 12px 11px; margin-bottom: 18px; }
  .top10-info.show { display: block; animation: rise .35s; }
  .t10-title { font-size: 11.5px; font-weight: 700; color: #d4453a; margin-bottom: 10px; }
  .t10-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
  .t10-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .t10-cell .cnt { font-size: 10.5px; font-weight: 700; color: var(--muted); }
  .t10-cell .cnt b { color: var(--ink); }

  .controls { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 20px; }
  .controls label { color: var(--muted); font-size: 13px; font-weight: 600; }
  .stepper { display: flex; align-items: center; background: #fff; border-radius: 12px; overflow: hidden; border: 1px solid rgba(0,0,0,0.06); }
  .stepper button { width: 38px; height: 40px; border: none; background: transparent; font-size: 20px; font-weight: 700; color: var(--gold-deep); cursor: pointer; }
  .stepper button:hover { background: rgba(224,168,46,0.1); }
  .stepper input { width: 42px; height: 40px; border: none; background: transparent; text-align: center; font-size: 17px; font-weight: 700; color: var(--ink); font-family: inherit; }
  .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; }

  .btn { width: 100%; border: none; cursor: pointer; font-family: inherit; font-weight: 700; border-radius: 16px; transition: transform .12s, box-shadow .25s, filter .2s; }
  .btn-primary {
    padding: 16px; font-size: 16.5px; color: #fff; letter-spacing: .5px;
    background: linear-gradient(135deg, var(--gold), var(--gold-deep));
    box-shadow: 0 8px 20px rgba(201,138,24,0.32);
  }
  .btn-primary:hover { filter: brightness(1.04); box-shadow: 0 12px 26px rgba(201,138,24,0.42); }
  .btn-primary:active { transform: scale(0.97); }

  .results { margin-top: 24px; display: flex; flex-direction: column; gap: 13px; }
  .line { display: flex; gap: 9px; justify-content: center; align-items: center; flex-wrap: wrap; opacity: 0; transform: translateY(10px); animation: rise .5s forwards; }
  .line .idx { font-size: 12px; font-weight: 700; color: var(--muted); width: 16px; text-align: right; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }

  .ball {
    width: 46px; height: 46px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px; color: #fff; position: relative;
    box-shadow: inset -3px -4px 7px rgba(0,0,0,0.22), inset 2px 3px 5px rgba(255,255,255,0.45), 0 4px 8px rgba(0,0,0,0.18);
    animation: pop .4s backwards;
  }
  .ball::after { content: ""; position: absolute; top: 7px; left: 10px; width: 13px; height: 8px; background: rgba(255,255,255,0.7); border-radius: 50%; filter: blur(1px); }
  @keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
  .c1 { background: radial-gradient(circle at 35% 30%, #ffe066, #fbc400); color:#5a4500; }
  .c2 { background: radial-gradient(circle at 35% 30%, #9bdcff, #69c8f2); color:#073447; }
  .c3 { background: radial-gradient(circle at 35% 30%, #ff9d9d, #ff7272); }
  .c4 { background: radial-gradient(circle at 35% 30%, #cfcfcf, #a3a3a3); }
  .c5 { background: radial-gradient(circle at 35% 30%, #cde96b, #b0d840); color:#26380a; }

  .actions { margin-top: 20px; display: none; }
  .btn-primary.save { background: linear-gradient(135deg, #5db075, #3d8f5a); box-shadow: 0 8px 20px rgba(61,143,90,0.3); }
  .btn:disabled { opacity: .55; cursor: not-allowed; }
  .status { margin-top: 12px; font-size: 12.5px; min-height: 16px; font-weight: 600; color: var(--muted); transition: color .2s; }
  .status.ok { color: #2f8a4e; }
  .status.err { color: #d4453a; }

  /* 오른쪽 저장 기록 패널 */
  .sidebar h2 { font-size: 15px; color: var(--ink); display: flex; align-items: center; justify-content: space-between; margin-bottom: 4px; }
  .sidebar .sub { font-size: 11px; color: var(--muted); margin-bottom: 14px; }
  .refresh { border: none; background: transparent; cursor: pointer; font-size: 16px; color: var(--gold-deep); padding: 2px 6px; border-radius: 8px; }
  .refresh:hover { background: rgba(224,168,46,0.12); }
  .hist-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; max-height: 460px; padding-right: 2px; }
  .hist-empty { color: var(--muted); font-size: 12.5px; text-align: center; margin-top: 30px; line-height: 1.6; }
  .hitem { background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 13px; padding: 11px 12px; animation: rise .4s backwards; }
  .hitem .top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
  .hitem .time { color: var(--muted); font-size: 10.5px; font-weight: 600; }
  .hitem .tag { font-size: 9.5px; background: rgba(224,168,46,0.15); color: var(--gold-deep); padding: 2px 7px; border-radius: 6px; font-weight: 700; }
  .hitem .tag.pop { background: rgba(255,114,114,0.15); color: #d4453a; }
  .hgame { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 5px; }
  .hgame:last-child { margin-bottom: 0; }
  .mini { width: 24px; height: 24px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #fff; box-shadow: inset -1px -2px 3px rgba(0,0,0,0.2); }
  .plus { display: flex; align-items: center; color: var(--muted); font-weight: 700; font-size: 13px; }

  /* 왼쪽 최근 당첨번호 패널 */
  .win-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 9px; max-height: 460px; padding-right: 2px; }
  .witem { background: #fff; border: 1px solid rgba(0,0,0,0.05); border-radius: 13px; padding: 10px 11px; animation: rise .4s backwards; }
  .witem .top { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 7px; }
  .witem .no { font-size: 12px; font-weight: 800; color: var(--gold-deep); }
  .witem .date { font-size: 10px; color: var(--muted); font-weight: 600; }
  .wrow { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; }

  .footer { margin-top: 20px; color: var(--muted); font-size: 11.5px; font-weight: 500; }
  .footer .disc { display:block; margin-top:5px; font-size:10.5px; color:#a89a78; }

  @media (max-width: 980px) {
    .wrap { flex-wrap: wrap; max-width: 480px; }
    .card { flex: 1 1 100%; order: -1; }
    .sidebar { flex: 1 1 100%; }
    .hist-list, .win-list { max-height: 320px; }
  }
</style>
</head>
<body>
  <div class="orb o1"></div>
  <div class="orb o2"></div>

  <div class="wrap">
    <!-- 왼쪽: 최근 1등 당첨번호 -->
    <div class="sidebar">
      <h2>🏆 최근 당첨번호</h2>
      <p class="sub">1등 당첨번호 · 최근 10회</p>
      <div class="win-list" id="winList"></div>
    </div>

    <!-- 생성기 -->
    <div class="card">
      <span class="badge">✦ LUCKY DRAW ✦</span>
      <h1>행운 <span class="em">로또</span></h1>
      <p class="subtitle">1~45 중 6개 · 당신의 행운을 뽑아보세요</p>

      <div class="modes">
        <button class="mode-btn active" data-mode="random">🎲 완전 랜덤</button>
        <button class="mode-btn" data-mode="popular">🔥 인기 TOP10 조합</button>
      </div>

      <div class="top10-info" id="top10Info">
        <p class="t10-title">최근 10년간 1등에 포함된 횟수</p>
        <div class="t10-grid" id="t10grid"></div>
      </div>

      <div class="controls">
        <label>게임 수</label>
        <div class="stepper">
          <button id="minus" type="button">−</button>
          <input type="number" id="count" min="1" max="10" value="5" readonly>
          <button id="plus" type="button">+</button>
        </div>
        <label>줄</label>
      </div>

      <button id="generateBtn" class="btn btn-primary">번호 생성하기 ✨</button>

      <div class="results" id="results"></div>

      <div class="actions" id="actions">
        <button id="saveBtn" class="btn btn-primary save">☁️ 이 번호 저장하기</button>
      </div>
      <p class="status" id="status"></p>

      <p class="footer">
        행운을 빕니다! 🍀
        <span class="disc">※ 로또는 완전 무작위 추첨입니다. 재미로만 즐겨주세요.</span>
      </p>
    </div>

    <!-- 오른쪽: 저장 기록 -->
    <div class="sidebar">
      <h2>📜 저장 기록 <button class="refresh" id="refreshBtn" title="새로고침">⟳</button></h2>
      <p class="sub">DB에 저장된 번호 · 최근 20건</p>
      <div class="hist-list" id="history">
        <p class="hist-empty">아직 저장된 번호가 없어요.<br>번호를 생성하고 저장해 보세요!</p>
      </div>
    </div>
  </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, addDoc, getDocs,
  query, orderBy, limit, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Firebase 프로젝트 설정 (lotte-d9e9a)
const firebaseConfig = {
  apiKey: "AIzaSyD-oZl39BXtKagdsctoGEwj7tcz0BuaIgM",
  authDomain: "lotte-d9e9a.firebaseapp.com",
  projectId: "lotte-d9e9a",
  storageBucket: "lotte-d9e9a.firebasestorage.app",
  messagingSenderId: "292774497378",
  appId: "1:292774497378:web:94f9c1fa4831905a9f553b",
  measurementId: "G-KEDN7KBET0"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const COLLECTION = "lotto_games";

// 최근 10년 최다 출현 TOP10 (706~1227회 집계, 갱신: 2026-06-11)
const TOP10 = [
  { n: 12, count: 86 },
  { n: 16, count: 81 },
  { n: 21, count: 81 },
  { n: 45, count: 81 },
  { n: 33, count: 79 },
  { n: 3, count: 78 },
  { n: 6, count: 78 },
  { n: 13, count: 78 },
  { n: 18, count: 78 },
  { n: 38, count: 78 },
];
const TOP10_NUMS = TOP10.map(t => t.n);

// 최근 1등 당첨번호 10회 (매주 월요일 자동 갱신)
const RECENT_WINS = [
  { no: 1227, date: "2026-06-06", nums: [1,14,16,34,41,44], bonus: 13 },
  { no: 1226, date: "2026-05-30", nums: [4,6,13,17,26,28], bonus: 41 },
  { no: 1225, date: "2026-05-23", nums: [8,9,19,25,41,42], bonus: 33 },
  { no: 1224, date: "2026-05-16", nums: [9,18,21,27,44,45], bonus: 28 },
  { no: 1223, date: "2026-05-09", nums: [16,18,20,32,33,39], bonus: 26 },
  { no: 1222, date: "2026-05-02", nums: [4,11,17,22,32,41], bonus: 34 },
  { no: 1221, date: "2026-04-25", nums: [6,13,18,28,30,36], bonus: 9 },
  { no: 1220, date: "2026-04-18", nums: [2,22,25,28,34,43], bonus: 16 },
  { no: 1219, date: "2026-04-11", nums: [1,2,15,28,39,45], bonus: 31 },
  { no: 1218, date: "2026-04-04", nums: [3,28,31,32,42,45], bonus: 25 },
];

let lastGames = [];
let mode = 'random';

function pickRandom() {
  const set = new Set();
  while (set.size < 6) set.add(Math.floor(Math.random() * 45) + 1);
  return [...set].sort((a, b) => a - b);
}
function pickPopular() {
  const pool = [...TOP10_NUMS];
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }
  return pool.slice(0, 6).sort((a, b) => a - b);
}
function colorClass(n) {
  if (n <= 10) return 'c1';
  if (n <= 20) return 'c2';
  if (n <= 30) return 'c3';
  if (n <= 40) return 'c4';
  return 'c5';
}
function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = 'status' + (type ? ' ' + type : '');
}

// 추천 TOP10 + 1등 포함 횟수 렌더링
function renderTop10Info() {
  const grid = document.getElementById('t10grid');
  grid.innerHTML = '';
  TOP10.forEach(t => {
    const cell = document.createElement('div');
    cell.className = 't10-cell';
    cell.innerHTML = `<span class="ball ${colorClass(t.n)}" style="width:38px;height:38px;font-size:15px;animation:none">${t.n}</span>` +
      `<span class="cnt"><b>${t.count}</b>회</span>`;
    grid.appendChild(cell);
  });
}
function updateModeInfo() {
  document.getElementById('top10Info').classList.toggle('show', mode === 'popular');
}

// 왼쪽 최근 당첨번호 렌더링
function renderRecentWins() {
  const el = document.getElementById('winList');
  el.innerHTML = '';
  RECENT_WINS.forEach((w, i) => {
    const item = document.createElement('div');
    item.className = 'witem';
    item.style.animationDelay = (i * 0.04) + 's';
    const balls = w.nums.map(n => `<span class="mini ${colorClass(n)}">${n}</span>`).join('');
    item.innerHTML =
      `<div class="top"><span class="no">${w.no}회</span><span class="date">${w.date}</span></div>` +
      `<div class="wrow">${balls}<span class="plus">+</span><span class="mini ${colorClass(w.bonus)}">${w.bonus}</span></div>`;
    el.appendChild(item);
  });
}

function generate() {
  const count = parseInt(document.getElementById('count').value, 10) || 5;
  const results = document.getElementById('results');
  results.innerHTML = '';
  lastGames = [];

  for (let i = 0; i < count; i++) {
    const nums = mode === 'popular' ? pickPopular() : pickRandom();
    lastGames.push(nums);

    const line = document.createElement('div');
    line.className = 'line';
    line.style.animationDelay = (i * 0.09) + 's';

    const idx = document.createElement('span');
    idx.className = 'idx';
    idx.textContent = String.fromCharCode(65 + i);
    line.appendChild(idx);

    nums.forEach((n, k) => {
      const ball = document.createElement('div');
      ball.className = 'ball ' + colorClass(n);
      ball.style.animationDelay = (i * 0.09 + k * 0.05) + 's';
      ball.textContent = n;
      line.appendChild(ball);
    });
    results.appendChild(line);
  }
  document.getElementById('actions').style.display = 'block';
  setStatus('');
}

async function saveToFirebase() {
  if (!lastGames.length) { setStatus('먼저 번호를 생성하세요.', 'err'); return; }
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; setStatus('저장 중…');
  try {
    await addDoc(collection(db, COLLECTION), {
      games: lastGames.map(nums => ({ nums })), // Firestore는 중첩 배열 불가 → 맵으로 감쌈
      count: lastGames.length,
      mode,
      source: 'web',
      createdAt: serverTimestamp()
    });
    setStatus('✅ 저장 완료! 오른쪽 기록에 추가됐어요.', 'ok');
    loadHistory(); // 저장 직후 오른쪽 패널 자동 갱신
  } catch (e) {
    console.error(e); setStatus('저장 실패: ' + e.message, 'err');
  } finally { btn.disabled = false; }
}

async function loadHistory() {
  const historyEl = document.getElementById('history');
  try {
    const q = query(collection(db, COLLECTION), orderBy('createdAt', 'desc'), limit(20));
    const snap = await getDocs(q);
    if (snap.empty) {
      historyEl.innerHTML = '<p class="hist-empty">아직 저장된 번호가 없어요.<br>번호를 생성하고 저장해 보세요!</p>';
      return;
    }
    historyEl.innerHTML = '';
    let i = 0;
    snap.forEach(doc => {
      const d = doc.data();
      const item = document.createElement('div');
      item.className = 'hitem';
      item.style.animationDelay = (i++ * 0.04) + 's';

      const t = d.createdAt?.toDate ? d.createdAt.toDate().toLocaleString('ko-KR', {
        month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
      }) : '시간 정보 없음';
      const tag = d.mode === 'popular'
        ? '<span class="tag pop">인기조합</span>'
        : (d.source && d.source.includes('top10')) ? '<span class="tag pop">추천</span>'
        : '<span class="tag">랜덤</span>';

      const gamesHtml = (d.games || []).map(g => {
        const balls = (g.nums || []).map(n =>
          `<span class="mini ${colorClass(n)}">${n}</span>`).join('');
        return `<div class="hgame">${balls}</div>`;
      }).join('');

      item.innerHTML = `<div class="top"><span class="time">🕒 ${t}</span>${tag}</div>${gamesHtml}`;
      historyEl.appendChild(item);
    });
  } catch (e) {
    console.error(e);
    historyEl.innerHTML = `<p class="hist-empty">기록을 불러오지 못했어요.<br>${e.message}</p>`;
  }
}

// 모드 토글
document.querySelectorAll('.mode-btn').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    mode = b.dataset.mode;
    updateModeInfo();
    generate();
  });
});
// 스텝퍼
const countEl = document.getElementById('count');
document.getElementById('plus').addEventListener('click', () => { countEl.value = Math.min(10, (+countEl.value) + 1); });
document.getElementById('minus').addEventListener('click', () => { countEl.value = Math.max(1, (+countEl.value) - 1); });
document.getElementById('generateBtn').addEventListener('click', generate);
document.getElementById('saveBtn').addEventListener('click', saveToFirebase);
document.getElementById('refreshBtn').addEventListener('click', loadHistory);

renderTop10Info();   // 추천 번호 + 1등 포함 횟수
updateModeInfo();
renderRecentWins();  // 왼쪽 최근 당첨번호
generate();
loadHistory();       // 페이지 로드 시 저장 기록 자동 표시
</script>
</body>
</html>
